name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python_arch: x64
            artifact_name: hardware-encryption-test-linux-x64
            binary_path: dist/hardware-encryption-test
          - os: windows-latest
            python_arch: x64
            artifact_name: hardware-encryption-test-windows-x64
            binary_path: dist/hardware-encryption-test.exe
          - os: windows-11-arm
            python_arch: arm64
            artifact_name: hardware-encryption-test-windows-arm64
            binary_path: dist/hardware-encryption-test.exe
            verify_windows_arm64: true
          - os: macos-latest
            python_arch: x64
            artifact_name: hardware-encryption-test-macos
            binary_path: dist/hardware-encryption-test

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.21.0

      - name: Build
        run: pyinstaller --onefile --name hardware-encryption-test app.py

      - name: Verify Windows ARM64 executable
        if: matrix.verify_windows_arm64
        shell: pwsh
        run: |
          python -c "import pathlib, struct; data = pathlib.Path(r'${{ matrix.binary_path }}').read_bytes(); pe = struct.unpack_from('<I', data, 0x3c)[0]; machine = struct.unpack_from('<H', data, pe + 4)[0]; assert machine == 0xAA64, f'Expected ARM64 PE (0xAA64), got 0x{machine:04X}'; print('Verified ARM64 PE executable')"

      - name: Prepare artifact directory
        shell: bash
        run: |
          mkdir -p artifact
          cp "${{ matrix.binary_path }}" artifact/
          cp testdata/lorem-500kb.txt artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact/
